name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements-pipeline.txt pytest

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke-rank on sample data
        run: python tests/smoke.py
